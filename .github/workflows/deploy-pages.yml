name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
          VITE_CLIENT_SECRET: ${{ secrets.VITE_CLIENT_SECRET }}
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_TOKEN_URL: ${{ secrets.VITE_TOKEN_URL }}
          VITE_RETIREMENT_CASE_TYPE_ID: ${{ secrets.VITE_RETIREMENT_CASE_TYPE_ID }}
          VITE_PURCHASE_CASE_TYPE_ID: ${{ secrets.VITE_PURCHASE_CASE_TYPE_ID }}
          VITE_INSPECTION_CASE_TYPE_ID: ${{ secrets.VITE_INSPECTION_CASE_TYPE_ID }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
